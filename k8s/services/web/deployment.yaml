apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: insure-iq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nuxt
        image: insure-iq-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NUXT_HOST
          value: "0.0.0.0"
        - name: NUXT_PORT
          value: "3000"
        - name: NUXT_PUBLIC_AUTH_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: NUXT_PUBLIC_AUTH_BASE_URL
        - name: NUXT_PUBLIC_APP_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: NUXT_PUBLIC_APP_BASE_URL
        - name: NUXT_PUBLIC_API_SCHEME
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: NUXT_PUBLIC_API_SCHEME
        - name: NUXT_PUBLIC_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: NUXT_PUBLIC_API_BASE_URL
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: insure-iq
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 3000
    name: http