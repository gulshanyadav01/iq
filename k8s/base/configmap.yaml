apiVersion: v1
kind: ConfigMap
metadata:
  name: insure-iq-config
  namespace: insure-iq
data:
  DEBUG: "true"
  APP_ENV: "DEV"
  ALLOWED_HOSTS: "*"
  CSRF_TRUSTED_ORIGINS: "http://localhost,http://localhost:3000"
  HOST_NAME: "http://localhost"
  BETTER_AUTH_URL: "http://auth"
  DB_HOST: "postgres"
  DB_NAME: "insur_iq"
  DB_USER: "postgres"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  CELERY_CACHE_BACKEND: "redis://redis:6379/2"
  AWS_S3_ENDPOINT_URL: "http://minio:9000"
  AWS_S3_PUBLIC_ENDPOINT_URL: "http://localhost:9900"
  AWS_STORAGE_BUCKET_NAME: "insure-iq"
  AWS_REGION: "ap-south-1"
  NUXT_PUBLIC_AUTH_BASE_URL: "http://localhost:10000"
  NUXT_PUBLIC_APP_BASE_URL: "http://localhost:3000"
  NUXT_PUBLIC_API_SCHEME: "http"
  NUXT_PUBLIC_API_BASE_URL: "localhost:8000"
  NODE_ENV: "production"
  NUXT_HOST: "0.0.0.0"
  NUXT_PORT: "3000"
  NODE_ENV_AUTH: "production"
  PORT: "10000"
  BASE_DOMAIN: "localhost"
  DATABASE_STRING: "postgres://postgres:postgres@postgres:5432/auth"
  TRUSTED_ORIGINS: "http://localhost:3000,http://localhost:8080"