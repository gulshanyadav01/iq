apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: insure-iq-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insure-iq.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^/auth/(api/auth/.*)$ /$1 break;
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 80
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
