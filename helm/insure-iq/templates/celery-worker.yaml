apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insure-iq.labels" . | nindent 4 }}
    app: celery-worker
spec:
  replicas: {{ .Values.celery.worker.replicas }}
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery
        image: "{{ .Values.global.imageRegistry }}{{ .Values.images.backend }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command:
        - celery
        - -A
        - config
        - worker
        - -l
        - info
        envFrom:
        - configMapRef:
            name: insure-iq-config
        - secretRef:
            name: backend-secrets
        resources:
          {{- toYaml .Values.celery.worker.resources | nindent 12 }}
