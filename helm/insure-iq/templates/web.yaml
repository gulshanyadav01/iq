apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insure-iq.labels" . | nindent 4 }}
    app: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nuxt
        image: "{{ .Values.global.imageRegistry }}{{ .Values.images.web }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NUXT_HOST
          value: "0.0.0.0"
        - name: NUXT_PORT
          value: "3000"
        - name: NUXT_PUBLIC_AUTH_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: NUXT_PUBLIC_AUTH_BASE_URL
        - name: NUXT_PUBLIC_APP_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: NUXT_PUBLIC_APP_BASE_URL
        - name: NUXT_PUBLIC_API_SCHEME
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: NUXT_PUBLIC_API_SCHEME
        - name: NUXT_PUBLIC_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: NUXT_PUBLIC_API_BASE_URL
        # Readiness probe disabled - Nuxt dev mode is slow to start
        # readinessProbe:
        #   httpGet:
        #     path: /
        #     port: 3000
        #   initialDelaySeconds: 60
        #   periodSeconds: 10
        #   timeoutSeconds: 10
        # Liveness probe disabled for now
        # livenessProbe:
        #   httpGet:
        #     path: /
        #     port: 3000
        #   initialDelaySeconds: 120
        #   periodSeconds: 15
        #   timeoutSeconds: 10
        resources:
          {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insure-iq.labels" . | nindent 4 }}
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 3000
    name: http
