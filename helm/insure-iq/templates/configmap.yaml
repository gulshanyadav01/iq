apiVersion: v1
kind: ConfigMap
metadata:
  name: insure-iq-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insure-iq.labels" . | nindent 4 }}
data:
  # App
  DEBUG: "{{ .Values.app.debug }}"
  APP_ENV: "{{ .Values.app.env }}"
  ALLOWED_HOSTS: "{{ .Values.app.allowedHosts }}"
  CSRF_TRUSTED_ORIGINS: "{{ .Values.app.csrfTrustedOrigins }}"
  HOST_NAME: "{{ .Values.app.hostName }}"

  # Database
  DB_HOST: "{{ .Values.db.host }}"
  DB_NAME: "{{ .Values.db.name }}"
  DB_USER: "{{ .Values.db.user }}"

  # Backend specific
  BETTER_AUTH_URL: "http://auth"
  NUXT_HOST: "0.0.0.0"
  NUXT_PORT: "3000"

  # Web / Nuxt
  NODE_ENV: "production"
  NODE_ENV_AUTH: "production"
  NUXT_PUBLIC_AUTH_BASE_URL: "{{ .Values.web.nuxtPublicAuthBaseUrl }}"
  NUXT_PUBLIC_APP_BASE_URL: "{{ .Values.web.nuxtPublicAppBaseUrl }}"
  NUXT_PUBLIC_API_SCHEME: "{{ .Values.web.nuxtPublicApiScheme }}"
  NUXT_PUBLIC_API_BASE_URL: "{{ .Values.web.nuxtPublicApiBaseUrl }}"
  NUXT_PUBLIC_ENABLED_SOCIAL_PROVIDERS: "{{ .Values.web.nuxtPublicEnabledSocialProviders }}"

  # Auth service
  PORT: "10000"
  BASE_DOMAIN: "{{ .Values.auth.baseDomain }}"
  TRUSTED_ORIGINS: "{{ .Values.auth.trustedOrigins }}"
  WEBHOOK_EP: "{{ .Values.auth.webhookEp }}"

  # Celery
  {{- if .Values.redis.enabled }}
  CELERY_BROKER_URL: "{{ .Values.redis.brokerUrl }}"
  CELERY_RESULT_BACKEND: "{{ .Values.redis.resultBackend }}"
  CELERY_CACHE_BACKEND: "{{ .Values.redis.cacheBackend }}"
  {{- end }}

  # MinIO / S3
  AWS_S3_ENDPOINT_URL: "{{ .Values.minio.s3EndpointUrl }}"
  AWS_S3_PUBLIC_ENDPOINT_URL: "{{ .Values.minio.s3PublicEndpointUrl }}"
  AWS_STORAGE_BUCKET_NAME: "{{ .Values.minio.bucketName }}"
  AWS_REGION: "{{ .Values.minio.region }}"

  # Auth database connection (if in-cluster postgres)
  {{- if .Values.postgres.enabled }}
  DATABASE_STRING: "postgres://{{ .Values.secrets.postgresSecretUsername }}:{{ .Values.secrets.postgresSecretPassword }}@postgres:5432/auth"
  {{- end }}
