apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insure-iq.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: "{{ .Values.secrets.secretKey }}"
  WEBHOOK_SECRET_KEY: "{{ .Values.secrets.webhookSecretKey }}"
  DB_PASSWORD: "{{ .Values.secrets.dbPassword }}"
  BETTER_AUTH_SECRET: "{{ .Values.secrets.betterAuthSecret }}"
  AWS_ACCESS_KEY_ID: "{{ .Values.secrets.awsAccessKeyId }}"
  AWS_SECRET_ACCESS_KEY: "{{ .Values.secrets.awsSecretAccessKey }}"
  GOOGLE_CLIENT_ID: "{{ .Values.secrets.googleClientId }}"
  GOOGLE_CLIENT_SECRET: "{{ .Values.secrets.googleClientSecret }}"
  GITHUB_CLIENT_ID: "{{ .Values.secrets.githubClientId }}"
  GITHUB_CLIENT_SECRET: "{{ .Values.secrets.githubClientSecret }}"
  MICROSOFT_CLIENT_ID: "{{ .Values.secrets.microsoftClientId }}"
  MICROSOFT_CLIENT_SECRET: "{{ .Values.secrets.microsoftClientSecret }}"
  GOOGLE_API_KEY: "{{ .Values.secrets.googleApiKey }}"
  MINERVA_API_URL: "{{ .Values.secrets.minervaApiUrl }}"
  POLICY_EXTRACT_CALLBACK_URL: "{{ .Values.secrets.policyExtractCallbackUrl }}"
---
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insure-iq.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: "{{ .Values.secrets.postgresSecretUsername }}"
  password: "{{ .Values.secrets.postgresSecretPassword }}"
---
{{- end }}
{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insure-iq.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: "{{ .Values.secrets.minioSecretUsername }}"
  password: "{{ .Values.secrets.minioSecretPassword }}"
{{- end }}
