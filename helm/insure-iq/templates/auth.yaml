apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insure-iq.labels" . | nindent 4 }}
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command:
        - sh
        - -c
        - until nc -z {{ .Values.db.host }} 5432; do echo "waiting for postgres"; sleep 2; done
      containers:
      - name: auth
        image: "{{ .Values.global.imageRegistry }}{{ .Values.images.auth }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["sh", "./entrypoint.sh"]
        args: ["start"]
        ports:
        - containerPort: 10000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: NODE_ENV_AUTH
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: PORT
        - name: BASE_DOMAIN
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: BASE_DOMAIN
        {{- if .Values.postgres.enabled }}
        - name: DATABASE_STRING
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: DATABASE_STRING
        {{- else }}
        - name: DATABASE_STRING
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DATABASE_STRING
        {{- end }}
        - name: TRUSTED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: TRUSTED_ORIGINS
        - name: AWS_S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: AWS_S3_ENDPOINT_URL
        - name: AWS_STORAGE_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: AWS_STORAGE_BUCKET_NAME
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: insure-iq-config
              key: AWS_REGION
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: WEBHOOK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: WEBHOOK_SECRET_KEY
        - name: WEBHOOK_EP
          value: "http://backend/api/auth/webhook/"
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: BETTER_AUTH_SECRET
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: GOOGLE_CLIENT_SECRET
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: GITHUB_CLIENT_SECRET
        - name: MICROSOFT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: MICROSOFT_CLIENT_ID
        - name: MICROSOFT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: MICROSOFT_CLIENT_SECRET
        readinessProbe:
          httpGet:
            path: /api/auth/ok
            port: 10000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/auth/ok
            port: 10000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          {{- toYaml .Values.auth.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insure-iq.labels" . | nindent 4 }}
    app: auth
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
  - port: 80
    targetPort: 10000
    name: http
