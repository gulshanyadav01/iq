repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=750"]
        # master_data/data/ holds carrier-supplied seed masters and the source
        # workbooks they derive from — data, not source. The Chola MMV books
        # are ~1.5MB each and cannot be split or shrunk without losing either
        # the CSV's reviewability or the ability to regenerate it via
        # `manage.py export_chola_mmv_csv`. The 750KB guard stays on for every
        # other path, which is where it earns its keep.
        exclude: "master_data/data/"
      - id: debug-statements
  # Ruff replaces black + isort + flake8 + autoflake (lint, import-sort, format,
  # unused-import removal) in one fast tool. Do not re-add those — they were
  # pinned to revs that no longer run on modern Python.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [markdown, yaml]
        # Lockfiles are generated + huge; prettier must not rewrite them
        # (would fail every commit/CI that touches the lockfile).
        exclude: '(^|/)(pnpm-lock\.yaml|package-lock\.json|yarn\.lock)$'
  # mypy is disabled as a commit-time gate: the codebase carries ~600
  # pre-existing type errors across the import graph, so mypy (which follows
  # imports) failed on ANY Python commit and was not a functioning gate. Type
  # checking should move to a CI job with a baseline before re-enabling here.
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: "v1.7.1"
  #   hooks:
  #     - id: mypy
  #       additional_dependencies:
  #         [
  #           types-PyYAML==6.0.12.11,
  #           "types-requests",
  #           "types-six",
  #           "sqlmodel",
  #           "types-Markdown",
  #           "types-cachetools",
  #           types-tzlocal,
  #         ]
  #       args: ["--check-untyped-defs", "--ignore-missing-imports"]
  #       exclude: "^templates/"
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        # Seed masters are transcribed VERBATIM from carrier-supplied
        # workbooks. Real vehicle names (ATHER, TORK, SXL, LOEV) and the
        # sources' own typos read as misspellings, and "correcting" one would
        # stop the row matching a grid that spells it the same way.
        exclude: "master_data/data/.*\\.csv$"
        args:
          [
            "--skip",
            "*.lock,pnpm-lock.yaml,*.min.js,*.css",
            "-L",
            "couldn,bu,nd",
          ]
