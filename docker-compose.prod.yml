services:
  auth:
    image: rhobotsai/auth:latest
    command: ["start"]
    ports:
      - ${PORT}:${PORT}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-10000}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:10000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-myauthsecret}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
      DATABASE_STRING: ${DATABASE_STRING:-postgres://postgres:postgres@postgres:5432/auth}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-miniosecret}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-operator}
      AWS_SENDER_EMAIL: ${AWS_SENDER_EMAIL:-}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:-mywebhooksecretkey}
      WEBHOOK_EP: ${WEBHOOK_EP:-http://backend:8000/api/auth/webhook/}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/auth/ok"]
      interval: 30s
      timeout: 10s
      retries: 3
  backend:
    build:
      dockerfile: ./backend/Dockerfile
      context: .
    image: insur-iq-backend:latest
    command: ["bash", "./entrypoint.sh", "prod"]
    ports:
      - "${API_PORT}:8000"
    volumes: &backend-volumes
      - operator-static:/app/static
      # Vertex AI service-account key (read-only); only consulted when
      # GOOGLE_GENAI_USE_VERTEXAI is set. Point GCP_CREDENTIALS_DIR at the host
      # dir holding sa-key.json.
      - ${GCP_CREDENTIALS_DIR:-./.gcp}:/secrets/gcp:ro
    environment: &backend-env
      DEBUG: ${DEBUG:-false}
      APP_ENV: ${APP_ENV:-PROD}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in production}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?WEBHOOK_SECRET_KEY is required in production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*,}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,}
      HOST_NAME: ${HOST_NAME:-http://localhost:8000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://auth:10000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-insur_iq}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-}
      AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-virtual}
      AWS_S3_SIGNATURE_VERSION: ${AWS_S3_SIGNATURE_VERSION:-s3v4}
      AWS_QUERYSTRING_EXPIRE: ${AWS_QUERYSTRING_EXPIRE:-3600}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-django-db}
      CELERY_CACHE_BACKEND: ${CELERY_CACHE_BACKEND:-django-cache}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MINERVA_API_URL: ${MINERVA_API_URL:-}
      POLICY_EXTRACT_CALLBACK_URL: ${POLICY_EXTRACT_CALLBACK_URL:-}
      # Read by policy_extract/tasks.py, so every service that imports it must
      # agree — the API's stale-retry check and the beat reconciler both compare
      # against the same threshold the worker enforces.
      POLICY_EXTRACT_SOFT_TIME_LIMIT: ${POLICY_EXTRACT_SOFT_TIME_LIMIT:-900}
      POLICY_EXTRACT_TIME_LIMIT: ${POLICY_EXTRACT_TIME_LIMIT:-1080}
      POLICY_EXTRACT_STALE_AFTER: ${POLICY_EXTRACT_STALE_AFTER:-1500}
      # Pre-MinerU PDF precheck caps (policy_extract/tasks.py).
      POLICY_EXTRACT_MAX_PAGES: ${POLICY_EXTRACT_MAX_PAGES:-50}
      POLICY_EXTRACT_MAX_BYTES: ${POLICY_EXTRACT_MAX_BYTES:-26214400}
      # Pages-in-flight gate, split OCR/LLM pipeline, capacity metrics — see .env.example.
      POLICY_EXTRACT_PAGE_GATE: ${POLICY_EXTRACT_PAGE_GATE:-false}
      POLICY_EXTRACT_MAX_PAGES_IN_FLIGHT: ${POLICY_EXTRACT_MAX_PAGES_IN_FLIGHT:-75}
      POLICY_EXTRACT_GATE_MAX_WAIT: ${POLICY_EXTRACT_GATE_MAX_WAIT:-240}
      POLICY_EXTRACT_GATE_RESERVE_PAGES: ${POLICY_EXTRACT_GATE_RESERVE_PAGES:-0}
      POLICY_EXTRACT_GATE_BACKFILL_SECONDS: ${POLICY_EXTRACT_GATE_BACKFILL_SECONDS:-30}
      POLICY_EXTRACT_SPLIT_LLM: ${POLICY_EXTRACT_SPLIT_LLM:-false}
      POLICY_EXTRACT_METRICS_ENABLED: ${POLICY_EXTRACT_METRICS_ENABLED:-false}
      POLICY_EXTRACT_METRICS_REGION: ${POLICY_EXTRACT_METRICS_REGION:-}
      # In-app MinerU GPU fleet management (capacity sync + autoscaling) — see .env.example.
      POLICY_EXTRACT_CAPACITY_CYCLE_SECONDS: ${POLICY_EXTRACT_CAPACITY_CYCLE_SECONDS:-60}
      POLICY_EXTRACT_PAGES_PER_GPU: ${POLICY_EXTRACT_PAGES_PER_GPU:-75}
      MINERU_TARGET_GROUP_ARN: ${MINERU_TARGET_GROUP_ARN:-}
      POLICY_EXTRACT_ADAPTIVE_CAPACITY: ${POLICY_EXTRACT_ADAPTIVE_CAPACITY:-false}
      POLICY_EXTRACT_GPU_AUTOSCALE: ${POLICY_EXTRACT_GPU_AUTOSCALE:-off}
      MINERU_ASG_NAME: ${MINERU_ASG_NAME:-}
      POLICY_EXTRACT_GPU_MIN: ${POLICY_EXTRACT_GPU_MIN:-1}
      POLICY_EXTRACT_GPU_MAX: ${POLICY_EXTRACT_GPU_MAX:-4}
      POLICY_EXTRACT_SCALE_OUT_LAG_HOURS: ${POLICY_EXTRACT_SCALE_OUT_LAG_HOURS:-1.0}
      POLICY_EXTRACT_SCALE_OUT_FAST_LAG_HOURS: ${POLICY_EXTRACT_SCALE_OUT_FAST_LAG_HOURS:-3.0}
      POLICY_EXTRACT_SCALE_IN_LAG_HOURS: ${POLICY_EXTRACT_SCALE_IN_LAG_HOURS:-0.25}
      POLICY_EXTRACT_SCALE_OUT_SUSTAIN_SECONDS: ${POLICY_EXTRACT_SCALE_OUT_SUSTAIN_SECONDS:-180}
      POLICY_EXTRACT_SCALE_IN_SUSTAIN_SECONDS: ${POLICY_EXTRACT_SCALE_IN_SUSTAIN_SECONDS:-1800}
      POLICY_EXTRACT_SCALE_COOLDOWN_SECONDS: ${POLICY_EXTRACT_SCALE_COOLDOWN_SECONDS:-600}
      # MinerU `backend` form field (core/services/mineru.py). Flip to
      # hybrid-http-client only in lockstep with the MinerU server cutover.
      MINERU_BACKEND: ${MINERU_BACKEND:-hybrid-auto-engine}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      POLICY_EXTRACT_GEMINI_MODEL: ${POLICY_EXTRACT_GEMINI_MODEL:-gemini-2.5-flash-lite}
      # Vertex AI backend for Gemini (opt-in). When GOOGLE_GENAI_USE_VERTEXAI is
      # truthy the SDK routes through Vertex and authenticates via ADC (no API
      # key), sourcing project/location from these vars and credentials from
      # GOOGLE_APPLICATION_CREDENTIALS (SA key JSON mounted read-only at
      # /secrets/gcp from the GCP_CREDENTIALS_DIR host path). GOOGLE_CLOUD_PROJECT
      # is required in Vertex mode (the client preflights it and fails fast if it
      # or the key file is missing). Use "global" or a regional endpoint like
      # "us-central1". Do NOT use bare "us"/"eu" multi-region — flash-lite isn't
      # provisioned there for this project and they need the .rep. hostname the
      # SDK doesn't build, so they 404. Leave the flag empty for the public Gemini
      # Developer API with GEMINI_API_KEY.
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/gcp/sa-key.json}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      EXCEL_AI_CLASSIFICATION_ENABLED: ${EXCEL_AI_CLASSIFICATION_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    image: insur-iq-backend:latest
    volumes: *backend-volumes
    command: ["bash", "./entrypoint.sh", "celery"]
    environment:
      <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  celery_policy_extract:
    image: insur-iq-backend:latest
    volumes: *backend-volumes
    command: ["bash", "./entrypoint.sh", "celery-policy-extract"]
    # No mem_limit: at POLICY_EXTRACT_CONCURRENCY children x the 512MB
    # --max-memory-per-child recycle threshold, any container cap low enough to be
    # meaningful is one the worker legitimately exceeds, and an OOM kill there
    # destroys an in-flight parse. Per-child recycling is the memory control;
    # size the host to the concurrency instead.
    environment:
      <<: *backend-env
      # Read by entrypoint.sh for --concurrency. Peak memory scales with it —
      # budget ~512MB of host RAM per child. See .env.example.
      POLICY_EXTRACT_CONCURRENCY: ${POLICY_EXTRACT_CONCURRENCY:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  celery_policy_extract_llm:
    image: insur-iq-backend:latest
    volumes: *backend-volumes
    command: ["bash", "./entrypoint.sh", "celery-policy-extract-llm"]
    # Gemini stages of the split pipeline (POLICY_EXTRACT_SPLIT_LLM). I/O-bound on
    # Gemini; idle until the flag is on.
    environment:
      <<: *backend-env
      POLICY_EXTRACT_LLM_CONCURRENCY: ${POLICY_EXTRACT_LLM_CONCURRENCY:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  celery_commission_intake:
    image: insur-iq-backend:latest
    volumes: *backend-volumes
    command: ["bash", "./entrypoint.sh", "celery-commission-intake"]
    environment:
      <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  beat:
    image: insur-iq-backend:latest
    volumes: *backend-volumes
    command: ["bash", "./entrypoint.sh", "beat"]
    environment:
      <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  web:
    image: insur-iq-web:latest
    build:
      dockerfile: ./web/Dockerfile
      context: .
      args:
        - NODE_ENV=${NODE_ENV:-development}
        - NUXT_PUBLIC_AUTH_BASE_URL=${NUXT_PUBLIC_AUTH_BASE_URL:-http://localhost:10000}
        - NUXT_PUBLIC_APP_BASE_URL=${NUXT_PUBLIC_APP_BASE_URL:-http://localhost:3000}
        - NUXT_PUBLIC_API_SCHEME=${NUXT_PUBLIC_API_SCHEME:-http}
        - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL:-localhost:8000}
        - NUXT_PUBLIC_ENABLED_SOCIAL_PROVIDERS=${NUXT_PUBLIC_ENABLED_SOCIAL_PROVIDERS:-}
        - NUXT_APP_BASE_URL=${NUXT_APP_BASE_URL:-/}
    ports:
      - "${APP_PORT}:3000"
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./conf/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - operator-static:/app/static:ro
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
    depends_on:
      - auth
      - backend
      - web
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80/",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  default:
    name: insur_iq_network

volumes:
  operator-static:
    driver: local
