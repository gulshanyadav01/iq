name: CI

on:
  pull_request:
  push:
    branches: [dev, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      service:
        description: "Service(s) to build & push (all, backend, web)"
        default: all
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs for fast feedback, but let push/tag runs finish:
  # push-ecr fans out into parallel image builds, and cancelling mid-flight
  # could leave a mismatched set in ECR (e.g. web:dev new, backend:dev stale).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    # Diff-scoped: lints ONLY files changed in this PR/push, not the whole repo.
    # The codebase predates linting, so a full-repo gate would be red on arrival;
    # this enforces the standard on all new/changed code and grandfathers legacy
    # debt until a file is next touched. The local husky hook is likewise
    # staged-files-only, so the two stay consistent.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff against the base

      - name: Resolve diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" 2>/dev/null || true
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "ref=$before" >> "$GITHUB_OUTPUT"
            else
              echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: List changed files
        id: changed
        run: |
          BASE="${{ steps.base.outputs.ref }}"
          git diff --name-only --diff-filter=ACMR "$BASE"...HEAD > /tmp/changed.txt \
            || git diff --name-only --diff-filter=ACMR "$BASE" HEAD > /tmp/changed.txt
          echo "----- changed files -----"; cat /tmp/changed.txt
          grep -q '^backend/' /tmp/changed.txt && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          grep -qE '^web/.*\.(vue|ts|js|mjs|cjs)$' /tmp/changed.txt && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend pre-commit (changed files only)
        if: steps.changed.outputs.backend == 'true'
        run: |
          pip install pre-commit
          pre-commit run \
            --config backend/.pre-commit-config.yaml \
            --from-ref "${{ steps.base.outputs.ref }}" --to-ref HEAD

      # Node/pnpm setup only when web source changed — otherwise setup-node's
      # `cache: pnpm` post-step hard-fails the job (no pnpm store exists because
      # the web block below never runs `pnpm install`).
      - name: Enable pnpm (corepack reads version from package.json)
        if: steps.changed.outputs.web == 'true'
        run: corepack enable
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.web == 'true'
        with:
          node-version: "24"
          cache: pnpm

      - name: Web eslint (changed files only)
        if: steps.changed.outputs.web == 'true'
        run: |
          mapfile -t FILES < <(grep -E '^web/.*\.(vue|ts|js|mjs|cjs)$' /tmp/changed.txt | sed 's#^web/##')
          echo "Linting ${#FILES[@]} changed web file(s): ${FILES[*]}"
          pnpm --filter web install --frozen-lockfile=false
          cd web && pnpm exec eslint "${FILES[@]}"

  # Backend and web tests are separate jobs so they run concurrently instead of
  # serially in one runner, and so the web leg doesn't wait on (or pay for) the
  # postgres/redis service containers it never touches.
  test-backend:
    name: Test (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insur_iq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # settings.py reads these with NO default; the non-pytest steps
    # (manage.py check / makemigrations / test) each need them in the job env.
    env:
      APP_ENV: DEV
      DEBUG: "True"
      SECRET_KEY: ci-test-secret-key
      WEBHOOK_SECRET_KEY: ci-test-webhook-secret
      SEND_WELCOME_EMAIL: "False"
      ALLOWED_HOSTS: "*,"
      CSRF_TRUSTED_ORIGINS: "http://localhost,"
      HOST_NAME: http://localhost
      BETTER_AUTH_URL: http://localhost/auth
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: insur_iq
      AWS_S3_ENDPOINT_URL: http://localhost:9000
      AWS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: ci-test
      AWS_SECRET_ACCESS_KEY: ci-test
      AWS_STORAGE_BUCKET_NAME: insur-iq
      AWS_REGION: ap-south-1
      CELERY_RESULT_BACKEND: django-db
      CELERY_CACHE_BACKEND: django-cache
      CELERY_BROKER_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Restores pip's HTTP cache keyed on requirements.txt, so wheels are
          # not re-downloaded (and psycopg2 not re-compiled) on every run.
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System deps (psycopg2 is a source build)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Django system checks (boot/smoke gate)
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Django deploy checks (PROD config)
        working-directory: backend
        env:
          APP_ENV: PROD
          SECRET_KEY: ci-only-non-default-secret-key
          WEBHOOK_SECRET_KEY: ci-only-non-default-webhook-secret
          CORS_ALLOWED_ORIGINS: https://example.com
        run: python manage.py check --deploy || true # informational; do not gate on warnings
      - name: Backend tests
        working-directory: backend
        # --parallel auto shards across the runner's cores, each shard on its
        # own test database.
        run: python manage.py test --verbosity 2 --parallel auto

  test-web:
    name: Test (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack reads version from package.json)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Web tests
        run: |
          pnpm --filter web install --frozen-lockfile=false
          pnpm --filter web test

  prep:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    # Single gate for the whole ECR pipeline: only on push (branches/tags) or
    # manual dispatch, never on PRs, never on master (prod images come from v*
    # tags cut from master via `pnpm release`, not from master pushes), and only
    # after lint + test pass — never push untested images. Stays dormant (no red
    # X) until AWS is wired up: the AWS_REGION repo Variable gates it.
    # push-ecr `needs: prep`, so skipping prep skips all legs.
    # NOTE: the service filter lives HERE (a prep job emitting a fromJSON matrix),
    # not in a `matrix.service` job-level `if:` — the `matrix` context is not
    # available in `jobs.<id>.if`, so that would silently skip every leg on a
    # single-service dispatch. See docs: contexts available in a job `if:` are
    # github / needs / vars / inputs only.
    needs: [lint, test-backend, test-web]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.AWS_REGION != ''
      && github.ref != 'refs/heads/master'
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - name: Resolve service list
        id: set
        run: |
          want='${{ github.event.inputs.service }}'   # empty on push; 'all' or a name on dispatch
          [ -z "$want" ] && want=all
          if [ "$want" = all ]; then
            echo 'services=["backend","web"]' >> "$GITHUB_OUTPUT"
          else
            echo "services=[\"$want\"]" >> "$GITHUB_OUTPUT"
          fi

  push-ecr:
    name: Build & push to ECR
    runs-on: ubuntu-latest
    # One matrix leg per image, built in parallel. Reuses the repo's own
    # build-and-push.sh per service (ECR login + git-sha / dev / semver tagging +
    # registry cache, which is per-service so parallel legs don't collide).
    # fail-fast: false so one image failing doesn't cancel the other.
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prep.outputs.services) }}
    permissions:
      id-token: write # required for keyless OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-and-push.sh reads git tags for semver tagging

      - name: Preflight — verify required config is set
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          fail=0
          [ -n "$AWS_REGION" ] || { echo "::error::Repo Variable AWS_REGION is unset — gh variable set AWS_REGION --body <region>"; fail=1; }
          [ -n "$ROLE_ARN" ]   || { echo "::error::Repo Secret AWS_ROLE_ARN is unset — gh secret set AWS_ROLE_ARN --body <role-arn>. See infra/aws/setup-aws.sh"; fail=1; }
          exit $fail

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ensure ECR repository exists
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          # Repo name matches build-and-push.sh's SERVICES map: insur-iq/<service>
          repo="insur-iq/${{ matrix.service }}"
          aws ecr describe-repositories --repository-names "$repo" --region "$AWS_REGION" >/dev/null 2>&1 \
            || aws ecr create-repository \
                 --repository-name "$repo" \
                 --region "$AWS_REGION" \
                 --image-tag-mutability MUTABLE \
                 --image-scanning-configuration scanOnPush=true >/dev/null

      - uses: docker/setup-buildx-action@v3

      # build-and-push.sh drives `docker buildx build` directly rather than
      # going through docker/build-push-action, so nothing has exported the
      # runtime credentials BuildKit needs to reach the GitHub Actions cache.
      # These vars are present in the action runtime but not in the job env.
      #
      # ACTIONS_CACHE_URL is deliberately NOT exported. It points at the retired
      # v1 cache service (artifactcache.actions.githubusercontent.com), and
      # BuildKit prefers v1 whenever it is set — which fails the build with an
      # Azure Front Door HTML page parsed as "failed to parse error response
      # 400". With only ACTIONS_RESULTS_URL present BuildKit uses the v2 API.
      - name: Export Actions cache runtime for BuildKit (CACHE_TYPE=gha)
        uses: actions/github-script@v7
        with:
          script: |
            for (const key of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              if (process.env[key]) core.exportVariable(key, process.env[key])
            }

      - name: Resolve image tag from ref
        id: tag
        run: |
          case "${GITHUB_REF}" in
            refs/heads/dev)    echo "image_tag=dev" >> "$GITHUB_OUTPUT" ;;
            refs/tags/v*)      echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT" ;;
            *)                 echo "image_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build & push image to ECR
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          DOCKER_PLATFORMS: linux/amd64
          # GitHub's own cache, co-located with the runner. The registry cache
          # this replaced round-tripped a mode=max manifest to ECR in
          # ap-south-1 on every build, which dominated the web image's time.
          # Roll back with CACHE_TYPE=registry if the Actions cache misbehaves.
          CACHE_TYPE: gha
        run: ./scripts/build-and-push.sh "${{ matrix.service }}"
