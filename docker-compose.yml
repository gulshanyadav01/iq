services:
  backend:
    build:
      dockerfile: ./backend/Dockerfile
      context: .
    image: insur-iq-backend:latest
    volumes: &backend-volumes
      - ./backend:/app
      # Vertex AI service-account key (read-only). Drop sa-key.json into ./.gcp
      # on the host; only consulted when GOOGLE_GENAI_USE_VERTEXAI is set.
      - ${GCP_CREDENTIALS_DIR:-./.gcp}:/secrets/gcp:ro
    command: ["bash", "./entrypoint.sh", "dev"]
    depends_on: &backend-depends-on
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment: &backend-env
      DEBUG: ${DEBUG:-true}
      APP_ENV: ${APP_ENV:-DEV}
      SECRET_KEY: ${SECRET_KEY:-mysecretkey}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:-mywebhooksecretkey}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*,}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:${PROXY_PORT:-8080},}
      HOST_NAME: ${HOST_NAME:-http://localhost:${PROXY_PORT:-8080}}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://auth:10000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-insur_iq}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:${MINIO_API_HOST_PORT:-9900}}
      AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-path}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-miniosecret}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-insur-iq}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-django-db}
      CELERY_CACHE_BACKEND: ${CELERY_CACHE_BACKEND:-django-cache}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MINERVA_API_URL: ${MINERVA_API_URL:-https://rhobots.pbpartners.com/api/mineru/file_parse}
      POLICY_EXTRACT_CALLBACK_URL: ${POLICY_EXTRACT_CALLBACK_URL:-}
      # Read by policy_extract/tasks.py, so every service that imports it must
      # agree — the API's stale-retry check and the beat reconciler both compare
      # against the same threshold the worker enforces.
      POLICY_EXTRACT_SOFT_TIME_LIMIT: ${POLICY_EXTRACT_SOFT_TIME_LIMIT:-900}
      POLICY_EXTRACT_TIME_LIMIT: ${POLICY_EXTRACT_TIME_LIMIT:-1080}
      POLICY_EXTRACT_STALE_AFTER: ${POLICY_EXTRACT_STALE_AFTER:-1500}
      # Pre-MinerU PDF precheck caps (policy_extract/tasks.py).
      POLICY_EXTRACT_MAX_PAGES: ${POLICY_EXTRACT_MAX_PAGES:-50}
      POLICY_EXTRACT_MAX_BYTES: ${POLICY_EXTRACT_MAX_BYTES:-26214400}
      # Pages-in-flight gate, split OCR/LLM pipeline, capacity metrics — see .env.example.
      POLICY_EXTRACT_PAGE_GATE: ${POLICY_EXTRACT_PAGE_GATE:-false}
      POLICY_EXTRACT_MAX_PAGES_IN_FLIGHT: ${POLICY_EXTRACT_MAX_PAGES_IN_FLIGHT:-75}
      POLICY_EXTRACT_GATE_MAX_WAIT: ${POLICY_EXTRACT_GATE_MAX_WAIT:-240}
      POLICY_EXTRACT_GATE_RESERVE_PAGES: ${POLICY_EXTRACT_GATE_RESERVE_PAGES:-0}
      POLICY_EXTRACT_GATE_BACKFILL_SECONDS: ${POLICY_EXTRACT_GATE_BACKFILL_SECONDS:-30}
      POLICY_EXTRACT_SPLIT_LLM: ${POLICY_EXTRACT_SPLIT_LLM:-false}
      POLICY_EXTRACT_METRICS_ENABLED: ${POLICY_EXTRACT_METRICS_ENABLED:-false}
      POLICY_EXTRACT_METRICS_REGION: ${POLICY_EXTRACT_METRICS_REGION:-}
      # MinerU `backend` form field (core/services/mineru.py). Flip to
      # hybrid-http-client only in lockstep with the MinerU server cutover.
      MINERU_BACKEND: ${MINERU_BACKEND:-hybrid-auto-engine}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      POLICY_EXTRACT_GEMINI_MODEL: ${POLICY_EXTRACT_GEMINI_MODEL:-gemini-2.5-flash-lite}
      # Vertex AI backend for Gemini (opt-in). When GOOGLE_GENAI_USE_VERTEXAI is
      # truthy the SDK routes through Vertex, sourcing project/location from
      # these vars and credentials from GOOGLE_APPLICATION_CREDENTIALS (the SA
      # key JSON dropped into ./.gcp on the host, mounted read-only at
      # /secrets/gcp). No API key is used on the Vertex path — auth is ADC.
      # Use "global" (default) or a regional endpoint like "us-central1". Do NOT
      # use bare "us"/"eu" multi-region — flash-lite isn't provisioned there for
      # this project and they need the .rep. hostname the SDK doesn't build, so
      # they 404. Leave the flag empty to use the public Gemini Developer API
      # with GEMINI_API_KEY. GOOGLE_CLOUD_PROJECT is required in Vertex mode (the
      # client preflights it).
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/gcp/sa-key.json}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      EXCEL_AI_CLASSIFICATION_ENABLED: ${EXCEL_AI_CLASSIFICATION_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    image: insur-iq-backend:latest
    volumes: *backend-volumes
    command: ["bash", "./entrypoint.sh", "celery"]
    environment:
      <<: *backend-env
      CELERY_AUTORELOAD: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  celery_policy_extract:
    image: insur-iq-backend:latest
    volumes: *backend-volumes
    command: ["bash", "./entrypoint.sh", "celery-policy-extract"]
    # No mem_limit: at POLICY_EXTRACT_CONCURRENCY children x the 512MB
    # --max-memory-per-child recycle threshold, any container cap low enough to be
    # meaningful is one the worker legitimately exceeds, and an OOM kill there
    # destroys an in-flight parse. Per-child recycling is the memory control;
    # size the host to the concurrency instead.
    environment:
      <<: *backend-env
      CELERY_AUTORELOAD: "1"
      # Read by entrypoint.sh for --concurrency. Peak memory scales with it —
      # budget ~512MB of host RAM per child. See .env.example.
      POLICY_EXTRACT_CONCURRENCY: ${POLICY_EXTRACT_CONCURRENCY:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  celery_policy_extract_llm:
    image: insur-iq-backend:latest
    volumes: *backend-volumes
    command: ["bash", "./entrypoint.sh", "celery-policy-extract-llm"]
    # Gemini stages of the split pipeline (POLICY_EXTRACT_SPLIT_LLM). I/O-bound on
    # Gemini; idle until the flag is on.
    environment:
      <<: *backend-env
      CELERY_AUTORELOAD: "1"
      POLICY_EXTRACT_LLM_CONCURRENCY: ${POLICY_EXTRACT_LLM_CONCURRENCY:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  celery_commission_intake:
    image: insur-iq-backend:latest
    volumes: *backend-volumes
    command: ["bash", "./entrypoint.sh", "celery-commission-intake"]
    environment:
      <<: *backend-env
      CELERY_AUTORELOAD: "1"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  beat:
    image: insur-iq-backend:latest
    volumes: *backend-volumes
    command: ["bash", "./entrypoint.sh", "beat"]
    environment:
      <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  web:
    image: insur-iq-web:latest
    build:
      dockerfile: ./web/Dockerfile.dev
      context: .
      args:
        - NODE_ENV=${NODE_ENV:-development}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NUXT_PUBLIC_AUTH_BASE_URL=${NUXT_PUBLIC_AUTH_BASE_URL:-http://localhost:${PROXY_PORT:-8080}/auth/api/auth}
      - NUXT_PUBLIC_APP_BASE_URL=${NUXT_PUBLIC_APP_BASE_URL:-http://localhost:${PROXY_PORT:-8080}}
      - NUXT_PUBLIC_API_SCHEME=${NUXT_PUBLIC_API_SCHEME:-http}
      - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL:-localhost:${PROXY_PORT:-8080}/service-api}
      - NUXT_PUBLIC_ENABLED_SOCIAL_PROVIDERS=${NUXT_PUBLIC_ENABLED_SOCIAL_PROVIDERS:-}
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: always

  auth:
    image: rhobotsai/auth:latest
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start"]
    ports:
      - "${AUTH_HOST_PORT:-10000}:10000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 10000
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-myauthsecret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${PROXY_PORT:-8080}/auth}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:${PROXY_PORT:-8080}}
      DATABASE_STRING: ${DATABASE_STRING:-postgres://postgres:postgres@postgres:5432/auth}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-miniosecret}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-insur-iq}
      AWS_SENDER_EMAIL: ${AWS_SENDER_EMAIL:-}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:-mywebhooksecretkey}
      WEBHOOK_EP: ${WEBHOOK_EP:-http://backend:8000/api/auth/webhook/}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/auth/ok"]
      interval: 30s
      timeout: 10s
      retries: 3

  proxy:
    image: nginx:alpine
    ports:
      - "${PROXY_PORT:-8080}:8080"
    volumes:
      - ./conf/nginx-dev/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - backend
      - auth
    restart: always

  minio:
    image: minio/minio
    command: minio server --address ':9000' --console-address ':9001' /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "${MINIO_API_HOST_PORT:-9900}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9901}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  minio_init:
    image: minio/minio
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        until (mc alias set myminio http://minio:9000 minio miniosecret 2>/dev/null) do echo '...' && sleep 1; done;
        mc mb --ignore-existing myminio/insur-iq;
        mc anonymous set download myminio/insur-iq;
        exit 0;
      "

  redis:
    image: redis:7
    restart: always
    # Cap broker memory and REFUSE to evict on OOM — Redis is the Celery broker,
    # so an eviction policy would silently drop queued tasks; noeviction makes it
    # reject writes (a surfaced error) instead of losing messages.
    command:
      [
        "redis-server",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-512mb}",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/scripts:/scripts
volumes:
  postgres_data:
    name: insur-iq_postgres_data
  minio_data:
    name: insur-iq_minio_data

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-insur_iq_network}
